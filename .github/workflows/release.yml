name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Strict semver guard
        run: |
          if ! printf '%s' "${GITHUB_REF}" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing to sign: ${GITHUB_REF} is not a strict semver release tag"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARBALL="outline-driven-${VERSION}.tar.gz"
          mkdir -p "dist/outline-driven-${VERSION}/prompts" "dist/outline-driven-${VERSION}/gitconfig"
          cp MINIMAL_PROMPT.md COMPACT_PROMPT.md GENERIC_PROMPT.md \
             "dist/outline-driven-${VERSION}/prompts/"
          cp recommended.gitconfig "dist/outline-driven-${VERSION}/gitconfig/"
          cp manifest.json LICENSE "dist/outline-driven-${VERSION}/"
          # Stamp version into manifest copy
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('dist/outline-driven-${VERSION}/manifest.json','utf8'));
            m.version = '${VERSION}'.replace(/^v/,'');
            m.releaseTag = '${VERSION}';
            fs.writeFileSync('dist/outline-driven-${VERSION}/manifest.json', JSON.stringify(m, null, 2));
          "
          tar -czf "${TARBALL}" -C dist "outline-driven-${VERSION}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Compute SHA256SUMS
        run: |
          sha256sum "${TARBALL}" > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TARBALL }}
            SHA256SUMS
            SHA256SUMS.sig
            SHA256SUMS.pem
